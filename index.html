:root{
  --bg:#F3ECE2;
  --paper:#FFFCF7;
  --ink:#2B1B2E;
  --ink-soft:#7A6B7D;
  --wine:#A63446;
  --wine-dark:#7C2536;
  --gold:#B8862F;
  --line:#E5D9C8;
  --slot-bg:#FFFFFF;
  --slot-booked:#E4DCD1;
  --ok-bg:#E9EFE0;
  --ok-ink:#3E5C2A;
  --font-heading:'Fraunces';
  --font-body:'Inter';
  --font-mono:'IBM Plex Mono';
  --shadow-sm:0 2px 8px rgba(20,10,25,0.05);
  --shadow-md:0 8px 24px -6px rgba(20,10,25,0.12);
  --shadow-lg:0 16px 40px -10px rgba(20,10,25,0.22);
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:9px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% 0%, rgba(255,255,255,0.5), transparent 45%),
    radial-gradient(circle at 90% 8%, rgba(0,0,0,0.035), transparent 40%);
  font-family:var(--font-body),sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:24px 12px 60px;
  -webkit-font-smoothing:antialiased;
}
.app{ width:100%; max-width:480px; }
.masthead{
  text-align:center;
  padding:26px 20px 24px;
  margin-bottom:22px;
  border-radius:var(--radius-lg);
  background:linear-gradient(150deg, var(--wine), var(--wine-dark) 120%);
  box-shadow:var(--shadow-lg);
  position:relative;
  overflow:hidden;
}
.masthead::before{
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(circle at 88% -20%, rgba(255,255,255,0.22), transparent 55%);
  pointer-events:none;
}
.masthead h1{ position:relative; font-family:var(--font-heading),serif; font-weight:700; font-size:27px; margin:0; letter-spacing:-0.3px; color:#fff; }
.masthead .sub{ position:relative; font-family:var(--font-body),sans-serif; font-style:normal; font-weight:600; color:rgba(255,255,255,0.82); font-size:11.5px; margin-top:6px; text-transform:uppercase; letter-spacing:1.8px; }
.staff-btn{ position:absolute; top:6px; right:0; background:none; border:1px solid var(--line); color:var(--ink-soft); font-size:11px; padding:6px 10px; border-radius:20px; cursor:pointer; font-family:var(--font-body),sans-serif; letter-spacing:0.3px; }
.staff-btn:hover{ border-color:var(--wine); color:var(--wine); }

.card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; box-shadow:var(--shadow-sm); transition:box-shadow .18s ease; }
.section-label{ font-family:var(--font-mono),monospace; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-soft); margin:0 0 12px; }

.cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-header .cal-title{ font-family:var(--font-heading),serif; font-weight:700; font-size:16px; text-transform:capitalize; }
.cal-nav-btn{ background:var(--paper); border:1.5px solid var(--line); border-radius:var(--radius-sm); width:32px; height:32px; font-size:15px; cursor:pointer; color:var(--ink); transition:all .15s ease; }
.cal-nav-btn:hover:not(:disabled){ border-color:var(--wine); color:var(--wine); }
.cal-nav-btn:disabled{ opacity:0.3; cursor:not-allowed; }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
.cal-weekdays div{ text-align:center; font-family:var(--font-mono),monospace; font-size:10px; color:var(--ink-soft); text-transform:uppercase; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); font-family:var(--font-mono),monospace; font-size:13px; font-weight:500; cursor:pointer; border:1.5px solid transparent; background:var(--slot-bg); transition:all .15s ease; }
.cal-cell.empty{ visibility:hidden; cursor:default; background:none; }
.cal-cell.past{ color:var(--line); cursor:not-allowed; background:none; }
.cal-cell.closed{ color:var(--ink-soft); text-decoration:line-through; cursor:not-allowed; background:none; }
.cal-cell.open:hover{ border-color:var(--wine); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.cal-cell.full{ background:var(--slot-booked); cursor:not-allowed; color:var(--ink-soft); }
.cal-cell.full:hover{ border-color:transparent; transform:none; box-shadow:none; }
.full-label{ font-size:6.5px; font-family:var(--font-mono),monospace; text-transform:uppercase; letter-spacing:0.02em; color:var(--wine); margin-top:1px; }
.cal-cell.selected{ background:var(--wine); color:#fff; box-shadow:var(--shadow-md); }
.cal-cell.today:not(.selected){ box-shadow: inset 0 0 0 1.5px var(--gold); font-weight:700; }

.service-list{ display:flex; flex-direction:column; gap:8px; }
.service-card{ display:flex; justify-content:space-between; align-items:center; gap:10px; border:1.5px solid var(--line); border-radius:var(--radius-md); padding:13px 15px; cursor:pointer; background:var(--slot-bg); transition:all .15s ease; }
.service-card:hover{ border-color:var(--wine); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.service-card.checked{ border-color:var(--wine); background:var(--ok-bg); }
.svc-check{ width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; background:var(--paper); }
.service-card.checked .svc-check{ background:var(--wine); border-color:var(--wine); }
.service-card .sname{ font-weight:600; font-size:14px; }
.service-card .smeta{ font-size:12px; color:var(--ink-soft); font-family:var(--font-mono),monospace; }
.service-card .sprice{ font-family:var(--font-mono),monospace; font-weight:600; color:var(--wine); font-size:14px; white-space:nowrap; padding-left:10px;}

.slots-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.slot{ font-family:var(--font-mono),monospace; font-size:13px; font-weight:600; padding:11px 4px; text-align:center; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--slot-bg); cursor:pointer; position:relative; transition:all .15s ease; }
.slot:hover{ border-color:var(--wine); transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.slot.booked{ background:var(--slot-booked); color:var(--ink-soft); text-decoration:line-through; cursor:not-allowed; }
.slot.blocked{ background:transparent; border-style:dashed; color:var(--ink-soft); cursor:not-allowed; }
.slot.selected{ background:var(--wine); border-color:var(--wine); color:#fff; }
.slot.admin-toggle:hover{ border-color:var(--gold); }
.slot.grace{ border-color:var(--gold); border-style:solid; box-shadow:0 0 0 1px var(--gold) inset; }
.slot-clock{ font-size:9px; margin-top:2px; color:var(--gold); letter-spacing:0.02em; }

.modal-overlay{ position:fixed; inset:0; background:rgba(20,10,20,0.55); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal-box{ background:var(--paper); border-radius:var(--radius-lg); padding:22px; max-width:340px; width:100%; box-shadow:var(--shadow-lg); }
.modal-text{ font-size:14px; line-height:1.5; margin-bottom:16px; color:var(--ink); }

.whatsapp-btn{ display:inline-block; background:#25D366; color:#fff; text-decoration:none; padding:11px 20px; border-radius:8px; font-weight:600; font-size:14px; font-family:var(--font-body),sans-serif; }
.whatsapp-btn:hover{ opacity:0.92; }
.slot-tip{ display:none; position:absolute; bottom:115%; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 10px; border-radius:8px; font-size:11px; line-height:1.5; white-space:nowrap; z-index:80; box-shadow:0 4px 14px rgba(0,0,0,0.3); text-decoration:none; text-align:left; }
.slot.has-tip:hover .slot-tip{ display:block; }

.empty-note{ font-size:13px; color:var(--ink-soft); text-align:center; padding:20px 0; }

label.field{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin:12px 0 5px; }
input[type=text], input[type=tel], input[type=time], input[type=number], input[type=password], input[type=email], input[type=date], select{
  width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
  font-family:var(--font-body),sans-serif; font-size:14px; background:#fff; color:var(--ink);
  transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus, select:focus{ outline:none; border-color:var(--wine); box-shadow:0 0 0 3px rgba(166,52,70,0.12); }
button.primary{ width:100%; margin-top:16px; padding:13px; background:linear-gradient(135deg, var(--wine), var(--wine-dark)); color:#fff; border:none; border-radius:var(--radius-sm); font-family:var(--font-body),sans-serif; font-weight:700; font-size:14px; cursor:pointer; letter-spacing:0.2px; box-shadow:var(--shadow-md); transition:transform .12s ease, box-shadow .12s ease; }
button.primary:hover{ transform:translateY(-1px); box-shadow:var(--shadow-lg); }
button.primary:active{ transform:translateY(0); }
button.secondary{ width:100%; margin-top:8px; padding:11px; background:var(--paper); border:1.5px solid var(--line); border-radius:var(--radius-sm); color:var(--ink-soft); font-weight:600; font-size:13px; cursor:pointer; transition:all .15s ease; }
button.secondary:hover{ border-color:var(--ink-soft); color:var(--ink); background:var(--bg); }
button.link-btn{ background:none; border:none; color:var(--wine); font-size:13px; font-weight:600; cursor:pointer; padding:0; }
button.link-btn:hover{ text-decoration:underline; }
.btn-row{ display:flex; gap:8px; margin-top:8px; }
.btn-row button{ margin-top:0; }

.stamp-wrap{ text-align:center; padding:20px 0 6px; }
.stamp{ width:120px; height:120px; border-radius:50%; border:3px solid var(--wine); color:var(--wine); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; transform:rotate(-8deg) scale(0.6); opacity:0; animation:stamp-in 0.4s ease-out forwards; }
@keyframes stamp-in{ to{ transform:rotate(-8deg) scale(1); opacity:1; } }
.stamp span{ font-family:var(--font-heading),serif; font-weight:700; font-size:15px; letter-spacing:1px; }
.confirm-detail{ font-family:var(--font-mono),monospace; font-size:14px; text-align:center; color:var(--ink); }
.confirm-detail .b{ font-weight:600; }

.appt-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; gap:6px; }
.appt-row:last-child{ border-bottom:none; }
.appt-row .time{ font-family:var(--font-mono),monospace; font-weight:600; width:48px; color:var(--wine); flex-shrink:0; }
.appt-row .info{ flex:1; min-width:0; }
.appt-row .info .name{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.appt-row .info .phone{ color:var(--ink-soft); font-size:12px; }
.appt-row .info .svc{ color:var(--gold); font-size:11px; font-family:var(--font-mono),monospace; }
.appt-row .actions{ display:flex; gap:8px; flex-shrink:0; }
.appt-row .actions button{ background:none; border:none; font-size:11px; cursor:pointer; text-decoration:underline; }
.appt-row .cancel{ color:#B4453B; }
.appt-row .edit{ color:var(--gold); }
.day-group-title{ font-family:var(--font-mono),monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); margin:18px 0 4px; }
.day-group-title:first-child{ margin-top:0; }

.check-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.day-check{ font-family:var(--font-mono),monospace; font-size:11px; font-weight:600; padding:7px 10px; border-radius:20px; border:1.5px solid var(--line); cursor:pointer; user-select:none; transition:all .15s ease; }
.day-check:hover{ border-color:var(--ink-soft); }
.day-check.on{ background:var(--ink); color:#fff; border-color:var(--ink); }

.tabbar{ display:flex; gap:4px; margin-bottom:18px; flex-wrap:wrap; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:5px; box-shadow:var(--shadow-sm); }
.tabbar button{ flex:1 1 auto; padding:9px 6px; font-size:11px; font-weight:700; border-radius:11px; border:none; background:none; cursor:pointer; color:var(--ink-soft); font-family:var(--font-body),sans-serif; min-width:70px; transition:all .15s ease; }

.loading{ text-align:center; padding:40px 0; color:var(--ink-soft); font-size:13px; }
.footer-note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:8px; }
.row2{ display:flex; gap:8px; }
.row2 > div{ flex:1; }

.filter-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }

.svc-edit-form{ border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:var(--bg); }
.svc-row-actions{ display:flex; gap:10px; flex-shrink:0; }
.svc-row-actions button{ background:none; border:none; cursor:pointer; text-decoration:underline; font-size:11px; }
.svc-row-actions .edit-btn{ color:var(--gold); }
.svc-row-actions .del-btn{ color:#B4453B; }

.palette-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.palette-swatch{ width:42px; height:42px; border-radius:50%; cursor:pointer; border:2px solid var(--line); flex-shrink:0; box-shadow:0 1px 0 rgba(43,27,46,0.05); }
.palette-swatch.selected{ border-color:var(--ink); box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.palette-label{ font-size:10px; color:var(--ink-soft); text-align:center; margin-top:4px; font-family:var(--font-mono),monospace; }
.palette-item{ text-align:center; }

.logo-preview{ text-align:center; margin-top:10px; }
.logo-preview img{ max-height:56px; max-width:160px; border-radius:6px; }
.masthead-logo{ max-height:52px; max-width:160px; display:block; margin:0 auto 8px; border-radius:8px; background:#fff; padding:4px; box-shadow:var(--shadow-md); position:relative; }

.chart-wrap{ display:flex; justify-content:center; margin-top:12px; }
.lunch-fields{ margin-top:8px; }

.toast-stack{ position:fixed; top:14px; left:0; right:0; z-index:999; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.toast{ position:relative; background:var(--wine); color:#fff; border-radius:10px; padding:12px 34px 12px 16px; max-width:320px; width:90%; box-shadow:0 6px 20px rgba(0,0,0,0.25); animation:toastIn 0.25s ease-out; pointer-events:auto; }
.toast-cancel{ background:#8C2F2F; }
.toast-new{ background:#2F6B4F; }
.toast-pending{ background:#A6742F; }
.toast-close{ position:absolute; top:6px; right:8px; background:none; border:none; color:#fff; font-size:17px; line-height:1; cursor:pointer; opacity:0.85; padding:2px 4px; }
.toast-close:hover{ opacity:1; }
.toast-title{ font-family:var(--font-mono),monospace; font-size:12px; font-weight:600; letter-spacing:0.03em; opacity:0.9; margin-bottom:4px; }
.toast-body{ font-size:13px; line-height:1.4; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:translateY(0); } }
</style>

function applyTheme(){
  const pal = PALETTES[config.colorPalette] || PALETTES.vinho;
  const root = document.documentElement.style;
  Object.entries(pal.vars).forEach(([k,v]) => root.setProperty('--'+k, v));
  const fs = FONT_SETS[config.fontSet] || FONT_SETS.classic;
  root.setProperty('--font-heading', "'"+fs.heading+"'");
  root.setProperty('--font-body', "'"+fs.body+"'");
  root.setProperty('--font-mono', "'"+fs.mono+"'");
}

function maskPhone(value){
  const d = (value||'').replace(/\D/g,'').slice(0,11);
  if(d.length === 0) return '';
  if(d.length <= 2) return d;
  if(d.length <= 7) return d.slice(0,2)+' '+d.slice(2);
  return d.slice(0,2)+' '+d.slice(2,7)+'-'+d.slice(7);
}
function onPhoneInput(el){ el.value = maskPhone(el.value); }
function isValidPhone(value){ return (value||'').replace(/\D/g,'').length === 11; }
function isFullName(value){ return (value||'').trim().split(/\s+/).filter(Boolean).length >= 2; }

// Resolve os serviços selecionados (um ou mais) em um objeto combinado: nome, preço total, duração total.
function resolveSelectedServices(ids){
  const list = (ids||[]).map(id => config.services.find(s => s.id === id)).filter(Boolean);
  if(list.length === 0) return null;
  return {
    ids: list.map(s => s.id),
    name: list.map(s => s.name).join(' + '),
    price: list.reduce((sum,s) => sum + Number(s.price||0), 0),
    duration: list.reduce((sum,s) => sum + Number(s.duration||0), 0)
  };
}

function pad(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromISODate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function displayDate(iso){ const d = fromISODate(iso); return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function todayISO(){ const d = new Date(); d.setHours(0,0,0,0); return toISODate(d); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return 'R$ ' + Number(n||0).toFixed(2).replace('.',','); }

const STORAGE_PREFIX = 'agenda_salao_';
const hasCloudStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';

async function storageGet(key, shared){
  if(hasCloudStorage){
    try{ return await window.storage.get(key, shared); }
    catch(e){ /* cai para o fallback local abaixo */ }
  }
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX+key);
    return raw ? { key, value: raw, shared: !!shared } : null;
  }catch(e){ return null; }
}

async function storageSet(key, value, shared){
  if(hasCloudStorage){
    try{
      const res = await window.storage.set(key, value, shared);
      if(res) return res;
    }catch(e){ /* cai para o fallback local abaixo */ }
  }
  try{
    localStorage.setItem(STORAGE_PREFIX+key, value);
    return { key, value, shared: !!shared };
  }catch(e){ return null; }
}

}

async function upsertClientFromBooking(name, phone){
  const phoneDigits = phone.replace(/\D/g,'');
  if(!phoneDigits) return;
  const now = new Date().toISOString();
  if(useFirestore){
    try{
      const ref = db.collection('clients').doc(phoneDigits);
      const snap = await ref.get();
      if(snap.exists){
        await ref.set({ name, phone, lastBookingAt: now }, { merge: true });
      } else {
        await ref.set({ id: phoneDigits, name, phone, firstSeenAt: now, lastBookingAt: now });
      }
    }catch(e){ /* não deve travar o agendamento se o cadastro de cliente falhar */ }
    return;
  }
  let client = clients.find(c => c.id === phoneDigits);
  if(client){
    client.name = name; client.phone = phone; client.lastBookingAt = now;
  } else {
    client = { id: phoneDigits, name, phone, firstSeenAt: now, lastBookingAt: now };
    clients.push(client);
  }
  await persistAllClientsFallback();
}

      if(change.type === 'added'){

    const session = JSON.parse(raw);
    const user = config.users.find(u => u.id === session.userId);

}

function startRealtimeSync(){
  if(!useFirestore || realtimeUnsub) return;
  realtimeUnsub = db.collection('appointments').onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      const data = change.doc.data();
      if(change.type === 'added'){
        const idx = appointments.findIndex(a => a.id === data.id);
        if(idx >= 0) appointments[idx] = data; else appointments.push(data);
        if(firstSnapshotDone && adminUnlocked) notifyNewAppointment(data);
      } else if(change.type === 'modified'){
        const idx = appointments.findIndex(a => a.id === data.id);
        if(idx >= 0) appointments[idx] = data; else appointments.push(data);
      } else if(change.type === 'removed'){
        appointments = appointments.filter(a => a.id !== data.id);
        if(localPendingDeletes.has(data.id)){
          localPendingDeletes.delete(data.id);
        } else if(firstSnapshotDone && adminUnlocked){
          notifyCancelledAppointment(data);
        }
      }
    });
    firstSnapshotDone = true;
    render();
  }, () => { /* erro de conexão: mantém os dados já carregados */ });
}

function isLunchMinute(min){
  const lb = config.lunchBreak;
  if(!lb || !lb.enabled) return false;
  const [lsh,lsm] = lb.start.split(':').map(Number);
  const [leh,lem] = lb.end.split(':').map(Number);
  const ls = lsh*60+lsm, le = leh*60+lem;
  return min >= ls && min < le;
}

function generateSlots(){
  const slots = [];
  const [sh, sm] = config.startTime.split(':').map(Number);
  const [eh, em] = config.endTime.split(':').map(Number);
  let cur = sh*60+sm;
  const end = eh*60+em;
  while(cur < end){
    if(!isLunchMinute(cur)) slots.push(pad(Math.floor(cur/60))+':'+pad(cur%60));
    cur += Number(config.slotDuration);
  }
  return slots;
}

function isDayOpen(iso){
  const d = fromISODate(iso);
  if(!config.workingDays.includes(d.getDay())) return false;
  if(config.blockedDates.includes(iso)) return false;
  return true;
}

function getTolerance(){
  const t = Number(config.slotTolerance);
  return isNaN(t) || t < 0 ? 15 : t;
}

// Para horários de hoje: 'ok' (ainda não chegou a hora), 'grace' (passou da hora, mas dentro da tolerância)
// ou 'expired' (tolerância esgotada, deve desativar).
function computeSlotTiming(iso, time){
  if(iso !== todayISO()) return { status:'ok' };
  const [h,m] = time.split(':').map(Number);
  const slotDate = new Date();
  slotDate.setHours(h, m, 0, 0);
  const tol = getTolerance();
  const graceEnd = new Date(slotDate.getTime() + tol*60000);
  const now = new Date();
  if(now < slotDate) return { status:'ok' };
  if(tol > 0 && now < graceEnd) return { status:'grace', msLeft: graceEnd - now };
  return { status:'expired' };
}

function isDayFull(iso){
  if(!isDayOpen(iso)) return false;
  const slots = generateSlots();
  if(slots.length === 0) return false;
  return slots.every(t => {
    const timing = computeSlotTiming(iso, t);
    if(timing.status === 'expired') return true;
    return slotStatus(iso, t) !== 'available';
  });
}

function slotStatus(iso, time, excludeId){
  const blocked = config.blockedSlots[iso] || [];
  if(blocked.includes(time)) return 'blocked';
  const booked = appointments.find(a => a.date === iso && a.time === time && a.id !== excludeId);
  if(booked) return 'booked';
  return 'available';
}

function buildMonthMatrix(year, month){
  const firstDow = new Date(year, month, 1).getDay();
  const total = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=total; d++) cells.push(toISODate(new Date(year, month, d)));
  while(cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}

function renderCalendar(opts){
  const base = new Date();
  base.setDate(1);
  const target = new Date(base.getFullYear(), base.getMonth()+opts.monthOffset, 1);
  const year = target.getFullYear(), month = target.getMonth();
  const weeks = buildMonthMatrix(year, month);
  const today = todayISO();

  let html = `<div class="cal-header">
    <button class="cal-nav-btn" ${opts.monthOffset<=0?'disabled':''} onclick="${opts.prevFn}()">‹</button>
    <div class="cal-title">${MONTHS[month]} ${year}</div>
    <button class="cal-nav-btn" onclick="${opts.nextFn}()">›</button>
  </div>
  <div class="cal-weekdays">${DOW_SHORT.map(d=>`<div>${d}</div>`).join('')}</div>
  <div class="cal-grid">`;

  weeks.forEach(week => {
    week.forEach(iso => {
      if(!iso){ html += '<div class="cal-cell empty"></div>'; return; }
      const d = fromISODate(iso);
      const isPast = iso < today;
      const closed = !isDayOpen(iso);
      const selected = iso === opts.selected;
      const isToday = iso === today;
      let cls = 'cal-cell';
      let click = '';
      let inner = `${d.getDate()}`;
      if(isPast){ cls += ' past'; }
      else if(closed && !opts.allowClosed){ cls += ' closed'; }
      else{
        const full = isDayFull(iso);
        if(full){
          cls += ' open full';
          inner = `<div style="display:flex;flex-direction:column;align-items:center;line-height:1.15;"><span>${d.getDate()}</span><span class="full-label">Lotado</span></div>`;
          if(opts.allowClosed) click = `onclick="${opts.clickFn}('${iso}')"`;
        } else {
          cls += ' open';
          click = `onclick="${opts.clickFn}('${iso}')"`;
        }
      }
      if(selected) cls += ' selected';
      if(isToday) cls += ' today';
      html += `<div class="${cls}" ${click}>${inner}</div>`;
    });
  });
  html += '</div>';
  return html;
}

  const app = document.getElementById('app');
  if(!config){ app.innerHTML = '<div class="loading">Abrindo a agenda...</div>'; return; }
  applyTheme();

  const logoHtml = config.logoUrl ? `<img class="masthead-logo" src="${escapeHtml(config.logoUrl)}" alt="logo" onerror="this.style.display='none'">` : '';
  let html = `<div class="masthead">
      ${logoHtml}
      <h1>${escapeHtml(config.salonName)}</h1>
      <div class="sub">agende seu horário</div>
    </div>`;

  if(flashMsg){
    html += `<div class="card flash ${flashOk?'ok':''}">${escapeHtml(flashMsg)}</div>`;
  }

  if(stampAppt){
    html += renderStampScreen();
  } else if(cancelRequestPending){
    html += renderCancelRequestScreen();
  } else if(view === 'client') html += renderClient();
  else if(view === 'admin-lock') html += renderAdminLock();
  else if(view === 'admin') html += renderAdmin();

  app.innerHTML = renderNotifications() + renderConfirmModal() + html;
  flashMsg = null;
}

      <button class="link-btn" onclick="selectedDate=null; selectedServiceIds=[]; selectedTime=null; render();">trocar</button>
    </div>
  </div>`;

  // Passo 2: escolher um ou mais serviços (com preços)
  if(selectedServiceIds.length === 0 || !bookingServicesConfirmed){
    let html = dateSummary;
    const combo = resolveSelectedServices(selectedServiceIds);
    html += '<div class="card"><p class="section-label">Escolha um ou mais serviços</p><div class="service-list">';
    config.services.forEach(s => {
      const checked = selectedServiceIds.includes(s.id);
      html += `<div class="service-card ${checked?'checked':''}" onclick="toggleService('${s.id}')">
        <div class="svc-check">${checked ? '✓' : ''}</div>
        <div><div class="sname">${escapeHtml(s.name)}</div><div class="smeta">${s.duration} min</div></div>
        <div class="sprice">${money(s.price)}</div>
      </div>`;
    });
    html += '</div></div>';
    if(combo){
      html += `<div class="card">
        <div class="step-summary">
          <p class="section-label" style="margin:0;">${selectedServiceIds.length} serviço(s) · <span class="val">${money(combo.price)}</span></p>
        </div>
        <button class="primary" onclick="confirmServiceSelection()">Continuar</button>
      </div>`;
    }
    html += `<div class="card" style="text-align:center;">
      <button class="secondary" onclick="selectedDate=null; render();">← Voltar</button>
    </div>`;
    return html;
  }

  if(selectedTime) return renderBookingForm();

  const svc = resolveSelectedServices(selectedServiceIds);
  let html = dateSummary;
  html += `<div class="card">
    <div class="step-summary">
      <p class="section-label" style="margin:0;">Serviços: <span class="val">${escapeHtml(svc ? svc.name : '')} · ${svc ? money(svc.price) : ''}</span></p>
      <button class="link-btn" onclick="bookingServicesConfirmed=false; selectedTime=null; render();">trocar</button>
    </div>
  </div>`;

  html += `<div class="card">`;
  const slots = generateSlots();
  const visible = slots.filter(t => computeSlotTiming(selectedDate, t).status !== 'expired');
  html += `<p class="section-label">Horários de ${DOW_FULL[d.getDay()]}, ${displayDate(selectedDate)}</p>`;
  if(visible.length === 0){
    html += '<div class="empty-note">Não há mais horários livres nesse dia. Escolha outra data acima.</div>';
  } else {
    html += '<div class="slots-grid">';
    visible.forEach(t => {
      const st = slotStatus(selectedDate, t);
      const timing = computeSlotTiming(selectedDate, t);
      if(st !== 'available'){
        html += `<div class="slot ${st}">${t}</div>`;
      } else if(timing.status === 'grace'){
        const secs = Math.max(0, Math.floor(timing.msLeft/1000));
        const mm = String(Math.floor(secs/60)).padStart(2,'0');
        const ss = String(secs%60).padStart(2,'0');
        html += `<div class="slot grace" onclick="pickSlot('${t}')">${t}<div class="slot-clock">${mm}:${ss}</div></div>`;
      } else {
        html += `<div class="slot" onclick="pickSlot('${t}')">${t}</div>`;
      }
    });
    html += '</div>';
  }
  html += '</div>';

  html += `<div class="card" style="text-align:center;">
    <button class="link-btn" onclick="openMyBookings()">Já tenho um horário marcado</button>
  </div>`;
  html += `<div class="card" style="text-align:center;">
    <button class="secondary" onclick="bookingServicesConfirmed=false; selectedTime=null; render();">← Voltar</button>
  </div>`;
  return html;
}

  if(!name || !phone){ flashMsg = 'Preencha nome e telefone para confirmar.'; flashOk=false; render(); return; }

  if(!isValidPhone(phone)){ flashMsg = 'Informe o telefone completo, com DDD (ex: 73 91234-5678).'; flashOk=false; render(); return; }
  const sameDayCount = appointments.filter(a => a.clientPhone === phone && a.date === selectedDate).length;
  if(sameDayCount >= 2){
    flashMsg = 'Esse telefone já tem 2 agendamentos nesse dia. Entre em contato com o salão para mais horários.'; flashOk=false; render(); return;
  }
  if(slotStatus(selectedDate, selectedTime) !== 'available'){

    selectedTime = null; render(); return;
  }
  const svc = resolveSelectedServices(selectedServiceIds);

    serviceName: svc ? svc.name : '',
    servicePrice: svc ? svc.price : 0,
    createdAt: new Date().toISOString()
  };
  appointments.push(appt);

  await upsertClientFromBooking(name, phone);

}

function playNotifySound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(ctx.destination);
    const now = ctx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.22, now+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now+0.4);
    o.start(now);
    o.stop(now+0.42);
  }catch(e){ /* áudio bloqueado pelo navegador, ignora */ }
}

function renderDashboard(){
  const today = todayISO();
  const now = new Date();
  const dow = now.getDay();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate()-dow); startOfWeek.setHours(0,0,0,0);
  const endOfWeek = new Date(startOfWeek); endOfWeek.setDate(startOfWeek.getDate()+6);
  const startOfWeekISO = toISODate(startOfWeek), endOfWeekISO = toISODate(endOfWeek);
  const startOfMonthISO = toISODate(new Date(now.getFullYear(), now.getMonth(), 1));
  const endOfMonthISO = toISODate(new Date(now.getFullYear(), now.getMonth()+1, 0));

  const countToday = appointments.filter(a => a.date === today).length;
  const countWeek = appointments.filter(a => a.date >= startOfWeekISO && a.date <= endOfWeekISO).length;
  const countMonth = appointments.filter(a => a.date >= startOfMonthISO && a.date <= endOfMonthISO).length;
  const future = appointments.filter(a => a.date >= today);
  const revenueMonth = appointments.filter(a => a.date >= startOfMonthISO && a.date <= endOfMonthISO)
    .reduce((sum,a) => sum + Number(a.servicePrice||0), 0);
  const revenueFuture = future.reduce((sum,a) => sum + Number(a.servicePrice||0), 0);
  const revenueToday = appointments.filter(a => a.date === today).reduce((sum,a) => sum + Number(a.servicePrice||0), 0);

  const svcCount = {};
  appointments.forEach(a => { if(a.serviceName){ svcCount[a.serviceName] = (svcCount[a.serviceName]||0)+1; } });
  let topService = '—';
  let topCount = 0;
  Object.entries(svcCount).forEach(([name,c]) => { if(c > topCount){ topCount = c; topService = name; } });

  const recent = [...appointments].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,5);

  let html = `<div class="card">
    <p class="section-label">Movimentação do salão</p>
    <div class="metric-grid">
      <div class="metric-card"><div class="mlabel">Hoje</div><div class="mvalue">${countToday}</div></div>
      <div class="metric-card"><div class="mlabel">Esta semana</div><div class="mvalue">${countWeek}</div></div>
      <div class="metric-card"><div class="mlabel">Este mês</div><div class="mvalue">${countMonth}</div></div>
      <div class="metric-card"><div class="mlabel">Agendamentos futuros</div><div class="mvalue">${future.length}</div></div>
      <div class="metric-card"><div class="mlabel">Faturamento hoje</div><div class="mvalue" style="font-size:18px;">${money(revenueToday)}</div></div>
      <div class="metric-card"><div class="mlabel">Faturamento do mês</div><div class="mvalue" style="font-size:18px;">${money(revenueMonth)}</div></div>
      <div class="metric-card"><div class="mlabel">Previsto (futuros)</div><div class="mvalue" style="font-size:18px;">${money(revenueFuture)}</div></div>
    </div>
    <p class="footer-note" style="text-align:left; margin-top:12px;">Serviço mais procurado: <strong>${escapeHtml(topService)}</strong>${topCount?` (${topCount}x)`:''}</p>
  </div>`;

  html += renderServicePerformance();

  html += `<div class="card"><p class="section-label">Últimos agendamentos feitos</p>`;
  if(recent.length === 0){ html += '<p class="empty-note">Ainda não há agendamentos.</p>'; }
  else{
    recent.forEach(a => {
      const d = fromISODate(a.date);
      html += `<div class="appt-row">
        <div class="time">${a.time}</div>
        <div class="info"><div class="name">${escapeHtml(a.clientName)}</div><div class="svc">${escapeHtml(a.serviceName||'')} · ${DOW_SHORT[d.getDay()]} ${displayDate(a.date)}</div></div>
      </div>`;
    });
  }
  html += '</div>';
  return html;
}

function setDashService(id){ dashServiceId = id; render(); }

function renderServicePerformance(){
  const today = todayISO();
  const svcOptions = config.services.map(s => `<option value="${s.id}" ${dashServiceId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('');

  const filtered = dashServiceId === 'all' ? appointments : appointments.filter(a =>
    a.serviceIds ? a.serviceIds.includes(dashServiceId) : a.serviceId === dashServiceId);
  const done = filtered.filter(a => a.date < today);
  const todo = filtered.filter(a => a.date >= today);
  const revenueDone = done.reduce((sum,a) => sum + Number(a.servicePrice||0), 0);
  const revenueTodo = todo.reduce((sum,a) => sum + Number(a.servicePrice||0), 0);

  let html = `<div class="card">
    <p class="section-label">Desempenho por serviço</p>
    <select onchange="setDashService(this.value)">
      <option value="all" ${dashServiceId==='all'?'selected':''}>Todos os serviços</option>
      ${svcOptions}
    </select>
    <div class="metric-grid" style="margin-top:12px;">
      <div class="metric-card"><div class="mlabel">Agendamentos feitos</div><div class="mvalue">${done.length}</div></div>
      <div class="metric-card"><div class="mlabel">A fazer</div><div class="mvalue">${todo.length}</div></div>
      <div class="metric-card"><div class="mlabel">Já faturado</div><div class="mvalue" style="font-size:18px;">${money(revenueDone)}</div></div>
      <div class="metric-card"><div class="mlabel">A faturar</div><div class="mvalue" style="font-size:18px;">${money(revenueTodo)}</div></div>
    </div>

function renderSvcBarChart(done, todo){
  const max = Math.max(done, todo, 1);
  const doneH = Math.round((done/max)*80);
  const todoH = Math.round((todo/max)*80);
  return `<div class="chart-wrap">
    <svg width="100%" viewBox="0 0 260 132" style="max-width:260px;">
      <line x1="18" y1="102" x2="242" y2="102" stroke="var(--line)" stroke-width="1"/>
      <text x="85" y="${96-doneH}" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="var(--font-mono),monospace" font-weight="600">${done}</text>
      <rect x="60" y="${100-doneH}" width="50" height="${doneH}" rx="4" fill="var(--wine)"/>
      <text x="85" y="117" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="var(--font-mono),monospace">Feitos</text>
      <text x="175" y="${96-todoH}" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="var(--font-mono),monospace" font-weight="600">${todo}</text>
      <rect x="150" y="${100-todoH}" width="50" height="${todoH}" rx="4" fill="var(--gold)"/>
      <text x="175" y="117" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="var(--font-mono),monospace">A fazer</text>
    </svg>
  </div>`;
}

function renderAdminAgenda(){
  if(adminEditingId) return renderAdminEditAppointment();

  const today = todayISO();
  const now = new Date();
  const dow = now.getDay();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate()-dow); startOfWeek.setHours(0,0,0,0);
  const endOfWeek = new Date(startOfWeek); endOfWeek.setDate(startOfWeek.getDate()+6);
  const startOfWeekISO = toISODate(startOfWeek), endOfWeekISO = toISODate(endOfWeek);
  const startOfMonthISO = toISODate(new Date(now.getFullYear(), now.getMonth(), 1));
  const endOfMonthISO = toISODate(new Date(now.getFullYear(), now.getMonth()+1, 0));

  let list;
  let title;
  if(adminAgendaCustomDate){
    list = appointments.filter(a => a.date === adminAgendaCustomDate);
    const dd = fromISODate(adminAgendaCustomDate);
    title = `Agendamentos de ${DOW_FULL[dd.getDay()]}, ${displayDate(adminAgendaCustomDate)}`;
  } else if(adminAgendaFilter === 'today'){
    list = appointments.filter(a => a.date === today);
    title = 'Agendamentos de hoje';
  } else if(adminAgendaFilter === 'week'){
    list = appointments.filter(a => a.date >= startOfWeekISO && a.date <= endOfWeekISO);
    title = 'Agendamentos desta semana';
  } else if(adminAgendaFilter === 'month'){
    list = appointments.filter(a => a.date >= startOfMonthISO && a.date <= endOfMonthISO);
    title = 'Agendamentos deste mês';
  } else {
    list = appointments.filter(a => a.date >= today);
    title = 'Próximos agendamentos';
  }
  list = [...list].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));

  let html = renderCancelRequestsSection();
  html += `<div class="card">
    <div class="filter-row">
      <button class="${adminAgendaFilter==='today'&&!adminAgendaCustomDate?'active':''}" onclick="setAgendaFilter('today')">Hoje</button>
      <button class="${adminAgendaFilter==='week'&&!adminAgendaCustomDate?'active':''}" onclick="setAgendaFilter('week')">Semana</button>
      <button class="${adminAgendaFilter==='month'&&!adminAgendaCustomDate?'active':''}" onclick="setAgendaFilter('month')">Mês</button>
      <button class="${adminAgendaFilter==='all'&&!adminAgendaCustomDate?'active':''}" onclick="setAgendaFilter('all')">Futuros</button>
    </div>
    <input class="filter-date" type="date" value="${adminAgendaCustomDate||''}" onchange="setAgendaCustomDate(this.value)">
  </div>`;

  html += `<div class="card"><p class="section-label">${title} (${list.length})</p>`;
  if(list.length === 0){ html += '<p class="empty-note">Nenhum agendamento nesse período.</p>'; }
  else{
    let lastDate = null;
    list.forEach(a => {
      if(a.date !== lastDate){
        const d = fromISODate(a.date);
        html += `<div class="day-group-title">${DOW_FULL[d.getDay()]}, ${displayDate(a.date)}</div>`;
        lastDate = a.date;
      }
      html += `<div class="appt-row">
        <div class="time">${a.time}</div>
        <div class="info"><div class="name">${escapeHtml(a.clientName)}</div><div class="phone">${escapeHtml(maskPhone(a.clientPhone))}</div><div class="svc">${escapeHtml(a.serviceName||'')}</div></div>
        <div class="actions">
          <button class="edit" onclick="startEditAppointment('${a.id}')">Editar</button>
          <button class="cancel" onclick="requestCancelConfirm('admin','${a.id}')">Cancelar</button>
        </div>
      </div>`;
    });
  }
  html += '</div>';
  return html;
}

function renderAdminEditAppointment(){

  const slots = generateSlots();
  html += `<p class="section-label" style="margin-top:16px;">Horário em ${DOW_FULL[d.getDay()]}, ${displayDate(adminEditDate)}</p><div class="slots-grid">`;
  slots.forEach(t => {
    const st = slotStatus(adminEditDate, t, a.id);

function adminEditPrevMonth(){ if(adminEditMonthOffset>0){ adminEditMonthOffset--; render(); } }
function adminEditNextMonth(){ adminEditMonthOffset++; render(); }
function pickEditDate(iso){ adminEditDate = iso; adminEditTime = null; render(); }
function pickEditTime(t){ adminEditTime = t; render(); }

async function saveEditAppointment(){
  const a = appointments.find(x => x.id === adminEditingId);
  if(!a) return;
  if(!adminEditTime){ flashMsg = 'Escolha um horário para salvar.'; flashOk=false; render(); return; }
  const newPhone = document.getElementById('editPhone').value.trim() || a.clientPhone;
  if(!isValidPhone(newPhone)){ flashMsg = 'Informe o telefone completo, com DDD (ex: 73 91234-5678).'; flashOk=false; render(); return; }
  a.clientName = document.getElementById('editName').value.trim() || a.clientName;
  a.clientPhone = newPhone;
  a.date = adminEditDate;
  a.time = adminEditTime;
  await updateAppointmentRecord(a);
  adminEditingId = null;
  flashMsg = 'Agendamento atualizado.'; flashOk = true;
  render();
}

function renderAdminHorarios(){
  if(!adminSelectedDate) adminSelectedDate = todayISO();
  const open = isDayOpen(adminSelectedDate);
  const dObj = fromISODate(adminSelectedDate);
  const isFullyBlocked = config.blockedDates.includes(adminSelectedDate);

  let html = `<div class="card">
    <p class="section-label">Gerenciar disponibilidade</p>
    ${renderCalendar({ monthOffset: adminMonthOffset, selected: adminSelectedDate, prevFn:'adminPrevMonth', nextFn:'adminNextMonth', clickFn:'pickAdminDate', allowClosed:true })}
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
      <p class="section-label" style="margin:0;">${DOW_FULL[dObj.getDay()]}, ${displayDate(adminSelectedDate)}</p>
      <button class="link-btn" onclick="toggleFullDayBlock('${adminSelectedDate}')">${isFullyBlocked ? 'Reabrir o dia' : 'Fechar o dia inteiro'}</button>
    </div>`;

  if(open){
    const slots = generateSlots();
    html += '<div class="slots-grid">';
    slots.forEach(t => {
      const st = slotStatus(adminSelectedDate, t);
      const cls = st === 'booked' ? 'booked' : (st === 'blocked' ? 'blocked' : 'admin-toggle');
      if(st === 'booked'){
        const appt = appointments.find(a => a.date === adminSelectedDate && a.time === t);
        const tip = appt
          ? `<div class="slot-tip"><strong>${escapeHtml(appt.clientName)}</strong><br>${escapeHtml(maskPhone(appt.clientPhone))}<br>${escapeHtml(appt.serviceName||'')}</div>`
          : '';
        html += `<div class="slot ${cls} has-tip">${t}${tip}</div>`;
      } else {
        html += `<div class="slot ${cls}" onclick="toggleBlock('${adminSelectedDate}','${t}')">${t}</div>`;
      }
    });
    html += '</div><p class="footer-note">Toque em um horário livre para bloqueá-lo. Passe o mouse sobre um horário ocupado para ver o agendamento.</p>';
  } else {
    html += `<p class="empty-note">Este dia está fechado ${isFullyBlocked ? '(bloqueado manualmente).' : '(fora dos dias de funcionamento).'}</p>`;
  }
  html += '</div>';
  return html;
}

function adminPrevMonth(){ if(adminMonthOffset>0){ adminMonthOffset--; render(); } }
function adminNextMonth(){ adminMonthOffset++; render(); }
function pickAdminDate(iso){ adminSelectedDate = iso; render(); }

async function toggleBlock(iso, time){
  if(!config.blockedSlots[iso]) config.blockedSlots[iso] = [];
  const idx = config.blockedSlots[iso].indexOf(time);
  if(idx >= 0) config.blockedSlots[iso].splice(idx,1); else config.blockedSlots[iso].push(time);
  await saveConfig();
}
async function toggleFullDayBlock(iso){
  const idx = config.blockedDates.indexOf(iso);
  if(idx >= 0) config.blockedDates.splice(idx,1); else config.blockedDates.push(iso);
  await saveConfig();
}

function cancelEditService(){ adminEditingServiceId = null; render(); }

async function saveEditService(id){

  if(!s) return;
  const name = document.getElementById('editSvcName_'+id).value.trim();
  const duration = Number(document.getElementById('editSvcDuration_'+id).value) || s.duration;

  s.name = name; s.duration = duration; s.price = price === '' ? s.price : Number(price);
  adminEditingServiceId = null;

  await saveConfig();

async function addService(){
  const name = document.getElementById('newSvcName').value.trim();
  const duration = Number(document.getElementById('newSvcDuration').value) || 60;
  const price = Number(document.getElementById('newSvcPrice').value) || 0;
  if(!name){ flashMsg = 'Digite o nome do serviço.'; flashOk=false; render(); return; }
  config.services.push({ id:'sv'+Date.now(), name, duration, price });
  flashMsg = 'Serviço cadastrado.'; flashOk = true;
  await saveConfig();
}
async function removeService(id){
  config.services = config.services.filter(s => s.id !== id);
  if(adminEditingServiceId === id) adminEditingServiceId = null;
  await saveConfig();
}

async function addUser(){
  const name = document.getElementById('newUserName').value.trim();
  if(!name){ flashMsg = 'Preencha o nome.'; flashOk=false; render(); return; }
  if(useFirestore){
    const email = document.getElementById('newUserEmail').value.trim();
    if(!email){ flashMsg = 'Preencha o e-mail.'; flashOk=false; render(); return; }
    if(config.users.some(u => u.email && u.email.toLowerCase() === email.toLowerCase())){
      flashMsg = 'Já existe um usuário com esse e-mail.'; flashOk=false; render(); return;
    }
    config.users.push({ id:'u'+Date.now(), name, email, pin:'' });
  } else {
    const pin = document.getElementById('newUserPin').value.trim();
    if(!pin){ flashMsg = 'Preencha o PIN.'; flashOk=false; render(); return; }
    if(config.users.some(u => u.pin === pin)){ flashMsg = 'Já existe um usuário com esse PIN.'; flashOk=false; render(); return; }
    config.users.push({ id:'u'+Date.now(), name, pin, email:'' });
  }
  flashMsg = 'Usuário cadastrado.'; flashOk = true;
  await saveConfig();
}
async function removeUser(id){
  if(config.users.length <= 1){ flashMsg = 'É necessário manter ao menos um usuário.'; flashOk=false; render(); return; }
  config.users = config.users.filter(u => u.id !== id);
  await saveConfig();
}

function renderTeamAccessCard(){
  const teamUrl = location.origin + location.pathname + '#equipe';
  return `<div class="card">
    <p class="section-label">Acesso da equipe</p>
    <p class="footer-note" style="text-align:left; margin:0 0 8px;">Link direto para a área da equipe (PIN necessário):</p>
    <input type="text" readonly value="${escapeHtml(teamUrl)}" onclick="this.select()" style="font-family:var(--font-mono),monospace; font-size:12px;">
    <p class="footer-note" style="margin-top:10px;">Abra o link no celular da equipe e use "Adicionar à tela de início" (Safari) / "Instalar app" (Chrome) para criar um atalho.</p>
    <p class="footer-note">Este link só funciona corretamente depois que o site estiver hospedado em um endereço público (ex: Firebase Hosting).</p>
  </div>`;
}

function renderAdminConfig(){
  const dayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  let dayChecks = '<div class="check-row">';
  dayLabels.forEach((lbl,i) => {
    const on = config.workingDays.includes(i);
    dayChecks += `<div class="day-check ${on?'on':''}" onclick="toggleWorkDay(${i})">${lbl}</div>`;
  });
  dayChecks += '</div>';

  const lunchOn = !!(config.lunchBreak && config.lunchBreak.enabled);
  const lunchFields = lunchOn ? `<div class="row2 lunch-fields">
        <div><label class="field">Início do almoço</label><input type="time" id="cfgLunchStart" value="${config.lunchBreak.start}"></div>
        <div><label class="field">Fim do almoço</label><input type="time" id="cfgLunchEnd" value="${config.lunchBreak.end}"></div>
      </div>` : '';

  const fontOptions = Object.entries(FONT_SETS).map(([key,f]) =>
    `<option value="${key}" ${config.fontSet===key?'selected':''}>${escapeHtml(f.label)}</option>`).join('');

  const paletteSwatches = Object.entries(PALETTES).map(([key,p]) => `
      <div class="palette-item">
        <div class="palette-swatch ${config.colorPalette===key?'selected':''}" style="background:linear-gradient(135deg, ${p.a} 50%, ${p.b} 50%);" onclick="previewPalette('${key}')" title="${escapeHtml(p.label)}"></div>
        <div class="palette-label">${escapeHtml(p.label)}</div>
      </div>`).join('');

  const logoPreview = config.logoUrl ? `<div class="logo-preview"><img src="${escapeHtml(config.logoUrl)}" onerror="this.parentElement.style.display='none'"></div>` : '';

  const backupOn = !!(config.backup && config.backup.enabled);
  const backupFields = backupOn ? `<div class="row2 lunch-fields">
        <div><label class="field">Horário preferido</label><input type="time" id="cfgBackupTime" value="${config.backup.time}"></div>
        <div><label class="field">Frequência</label>
          <select id="cfgBackupFreq">
            <option value="daily" ${config.backup.frequency==='daily'?'selected':''}>Diária</option>
            <option value="weekly" ${config.backup.frequency==='weekly'?'selected':''}>Semanal</option>
          </select>
        </div>
      </div>` : '';
  const lastBackupLabel = config.backup && config.backup.lastRunAt
    ? new Date(config.backup.lastRunAt).toLocaleString('pt-BR')
    : 'nunca';

  return `${renderTeamAccessCard()}
    <div class="card">
      <p class="section-label">Nome do salão</p>
      <input type="text" id="cfgName" value="${escapeHtml(config.salonName)}">
      <p class="section-label" style="margin-top:18px;">Dias de funcionamento</p>
      ${dayChecks}
      <p class="section-label" style="margin-top:18px;">Horário de funcionamento</p>
      <div class="row2">
        <div><label class="field">Abre</label><input type="time" id="cfgStart" value="${config.startTime}"></div>
        <div><label class="field">Fecha</label><input type="time" id="cfgEnd" value="${config.endTime}"></div>
      </div>
      <label class="field">Duração de cada horário na agenda (minutos)</label>
      <input type="number" id="cfgDuration" value="${config.slotDuration}" min="5" step="5">

      <p class="section-label" style="margin-top:18px;">Tolerância dos horários do dia</p>
      <label class="field">Minutos após o horário marcado até desativar automaticamente</label>
      <input type="number" id="cfgTolerance" value="${config.slotTolerance}" min="0" step="1">
      <p class="footer-note" style="text-align:left; margin-top:6px;">Se um horário de hoje passar e ninguém agendar, ele continua disponível (com um relógio contando) até esse tempo acabar — depois some da agenda automaticamente.</p>

      <p class="section-label" style="margin-top:18px;">Contato no WhatsApp</p>
      <input type="text" id="cfgWhatsapp" placeholder="https://wa.me/55DDDNUMERO" value="${escapeHtml(config.whatsappLink||'')}">
      <p class="footer-note" style="text-align:left; margin-top:6px;">Aparece como botão na tela inicial do agendamento para o cliente tirar dúvidas.</p>

      <p class="section-label" style="margin-top:18px;">Horário de almoço</p>
      <div class="check-row"><div class="day-check ${lunchOn?'on':''}" onclick="toggleLunchBreak()">${lunchOn?'Intervalo ativado':'Ativar intervalo de almoço'}</div></div>
      ${lunchFields}
      <p class="footer-note" style="text-align:left; margin-top:6px;">Enquanto ativo, os horários dentro do intervalo somem da agenda de agendamento.</p>

      <p class="section-label" style="margin-top:18px;">Logo do salão</p>
      <input type="text" id="cfgLogoUrl" placeholder="Cole o link da imagem (https://...)" value="${escapeHtml(config.logoUrl||'')}">
      ${logoPreview}

      <p class="section-label" style="margin-top:18px;">Conjunto de fontes</p>
      <select id="cfgFontSet" onchange="previewFontSet(this.value)">${fontOptions}</select>

      <p class="section-label" style="margin-top:18px;">Paleta de cores</p>
      <div class="palette-row">${paletteSwatches}</div>

      <button class="primary" onclick="saveAdminConfig()">Salvar ajustes</button>
    </div>

    <div class="card">
      <p class="section-label">Backup automático</p>
      <div class="check-row"><div class="day-check ${backupOn?'on':''}" onclick="toggleBackup()">${backupOn?'Backup ativado':'Ativar backup automático'}</div></div>
      ${backupFields}
      <p class="footer-note" style="text-align:left; margin-top:8px;">
        O backup automático salva uma cópia completa (agendamentos + configurações) na nuvem, dentro do próprio banco de dados, sempre que alguém da equipe abrir o painel após o horário previsto já ter passado — não depende de deixar o computador ligado. Último backup: <strong>${escapeHtml(lastBackupLabel)}</strong>.
      </p>
      <div class="btn-row">
        <button class="secondary" style="flex:1;" onclick="runBackupNow(false)">Fazer backup agora</button>
        <button class="secondary" style="flex:1;" onclick="downloadBackupFile()">Baixar cópia (.json)</button>
      </div>
      <p class="footer-note" style="text-align:left; margin-top:8px;">A cópia baixada em .json vai para a pasta de downloads padrão do navegador — os navegadores não permitem que um site escolha uma pasta do computador automaticamente.</p>
    </div>`;
}

function toggleWorkDay(i){
  const idx = config.workingDays.indexOf(i);
  if(idx >= 0) config.workingDays.splice(idx,1); else config.workingDays.push(i);
  render();
}

function toggleLunchBreak(){
  if(!config.lunchBreak) config.lunchBreak = {...DEFAULT_CONFIG.lunchBreak};
  config.lunchBreak.enabled = !config.lunchBreak.enabled;
  render();
}

function toggleBackup(){
  if(!config.backup) config.backup = {...DEFAULT_CONFIG.backup};
  config.backup.enabled = !config.backup.enabled;
  render();
}

function previewFontSet(key){ config.fontSet = key; render(); }
function previewPalette(key){ config.colorPalette = key; render(); }

async function saveAdminConfig(){
  config.salonName = document.getElementById('cfgName').value.trim() || DEFAULT_CONFIG.salonName;
  config.startTime = document.getElementById('cfgStart').value || DEFAULT_CONFIG.startTime;
  config.endTime = document.getElementById('cfgEnd').value || DEFAULT_CONFIG.endTime;
  config.slotDuration = Number(document.getElementById('cfgDuration').value) || DEFAULT_CONFIG.slotDuration;
  const tolVal = Number(document.getElementById('cfgTolerance').value);
  config.slotTolerance = isNaN(tolVal) || tolVal < 0 ? 15 : tolVal;
  const waInput = document.getElementById('cfgWhatsapp');
  config.whatsappLink = waInput ? waInput.value.trim() : config.whatsappLink;
  if(config.lunchBreak && config.lunchBreak.enabled){
    const ls = document.getElementById('cfgLunchStart');
    const le = document.getElementById('cfgLunchEnd');
    if(ls) config.lunchBreak.start = ls.value || config.lunchBreak.start;
    if(le) config.lunchBreak.end = le.value || config.lunchBreak.end;
  }
  if(config.backup && config.backup.enabled){
    const bt = document.getElementById('cfgBackupTime');
    const bf = document.getElementById('cfgBackupFreq');
    if(bt) config.backup.time = bt.value || config.backup.time;
    if(bf) config.backup.frequency = bf.value || config.backup.frequency;
  }
  const logoInput = document.getElementById('cfgLogoUrl');
  config.logoUrl = logoInput ? logoInput.value.trim() : config.logoUrl;
  flashMsg = 'Ajustes salvos.'; flashOk = true;
  await saveConfig();
}

async function checkAutoBackup(){
  if(!config || !config.backup || !config.backup.enabled) return;
  const last = config.backup.lastRunAt ? new Date(config.backup.lastRunAt) : null;
  const now = new Date();
  const intervalMs = (config.backup.frequency === 'weekly' ? 7 : 1) * 24*60*60*1000;
  if(!last || (now - last) >= intervalMs){
    await runBackupNow(true);
  }
}

async function runBackupNow(silent){
  const snapshot = { generatedAt: new Date().toISOString(), config, appointments };
  if(useFirestore){
    try{
      const key = todayISO()+'_'+Date.now();
      await db.collection('backups').doc(key).set(snapshot);
    }catch(e){ if(!silent){ flashMsg = 'Não foi possível fazer o backup agora.'; flashOk = false; render(); return; } }
  }
  if(!config.backup) config.backup = {...DEFAULT_CONFIG.backup};
  config.backup.lastRunAt = new Date().toISOString();
  await persistConfig();
  if(!silent){ flashMsg = 'Backup realizado agora.'; flashOk = true; render(); }
}

function downloadBackupFile(){
  const snapshot = { generatedAt: new Date().toISOString(), config, appointments };
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'backup-agenda-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

setInterval(() => {
  const onTimeStep = view === 'client' && !stampAppt && !clientSubView && selectedDate === todayISO() && bookingServicesConfirmed && !selectedTime;
  if(onTimeStep) render();
}, 1000);

loadData();
</script>
